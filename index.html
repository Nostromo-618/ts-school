<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ts-school compiles learner-authored source but never executes it, so
         everything is 'self' or 'none'. style-src is the one widening (scoped
         styles and vd3 theming emit inline styles; a static site cannot mint a
         nonce). frame-ancestors is absent on purpose — browsers ignore it in a
         <meta> policy and log an error; a server fronting these files must
         send `Content-Security-Policy: frame-ancestors 'none'` as a header.
         Rationale in README.md; directives are asserted by
         tests/unit/csp.spec.ts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://huggingface.co https://*.huggingface.co https://cdn.jsdelivr.net https://esm.run https://unpkg.com https://hf.co https://*.hf.co blob: data:; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; worker-src 'self' blob:; child-src 'self' blob:"
    />

    <!-- Page title and description are set per route via unhead (see App.vue)
         and baked into each prerendered page. The tags below are invariant
         across the whole site. -->
    <meta name="author" content="ts-school" />
    <meta
      name="keywords"
      content="TypeScript, JavaScript, learn TypeScript, type checking, tsc, static types, Node.js migration, type-level programming"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0d1117"
      media="(prefers-color-scheme: dark)"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TypeScript School" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
