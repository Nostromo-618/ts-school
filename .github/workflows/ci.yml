name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# All @vanduo-oss/* npm deps install from the registry except vdl-engines
# (file:../0_vanduo/labs until published). CI clones Labs as that sibling path.

# Least-privilege default token: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout Labs engines
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: vanduo-oss/labs
          path: .ci-labs

      - name: "Link Labs for file: dependency"
        run: |
          mkdir -p ../0_vanduo
          ln -sfn "$GITHUB_WORKSPACE/.ci-labs" ../0_vanduo/labs
          test -f ../0_vanduo/labs/package.json

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
      - run: pnpm run stylelint
      - run: pnpm run format:check
      - run: pnpm run typecheck

      - run: pnpm test

      - run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright Chromium Desktop
        run: pnpm run test:e2e

      - name: Playwright Chromium Mobile (responsive)
        run: pnpm run test:e2e:mobile
